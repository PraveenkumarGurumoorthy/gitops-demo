
name: GitOps Demo CI

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update Kubernetes deployment image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ steps.meta.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("k8s/deployment.yaml")
          content = path.read_text(encoding="utf-8")

          image_name_value = os.environ["IMAGE_NAME"].lower()
          image_name = re.escape(image_name_value)

          new_image = f"{image_name_value}:{os.environ['IMAGE_TAG']}"

          pattern = re.compile(
              r"(?m)^([ \t]*image:[ \t]*)"
              + image_name
              + r":[^\r\n]+"
          )

          updated, count = pattern.subn(
              lambda match: match.group(1) + new_image,
              content
          )

          if count != 1:
              raise SystemExit(
                  f"Expected exactly one matching image reference; found {count}."
              )

          path.write_text(updated, encoding="utf-8")
          print(f"Updated Kubernetes image to: {new_image}")
          PY

      - name: Commit and push Kubernetes manifest
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml

          if git diff --cached --quiet; then
            echo "No Kubernetes manifest changes to commit."
          else
            git commit -m "chore: update deployment image to ${IMAGE_TAG}"
            git push origin HEAD:main
          fi
